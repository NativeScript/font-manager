[package]
name = "font-manager-linux"
version = "1.0.21"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "fontmanager"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# not part of any parent workspace
[workspace]
